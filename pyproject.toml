[project]
name = "espadas-langgraph-websearchagent"
version = "0.1.0"
description = "Evaluación de Tavily como herramienta de búsqueda web para un agente LangGraph (coste, relevancia y mejoras)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.6",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.14",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
espadas-langgraph-websearchagent = "espadas_langgraph_websearchagent:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
